# ==========================================================================
#  ScamShield AI — Render Blueprint (Infrastructure as Code)
#  Docs: https://render.com/docs/blueprint-spec
#
#  One-click deploy: push this repo to GitHub, then in the Render dashboard
#  choose  New +  ->  Blueprint  and point it at your repo. Render reads this
#  file and provisions all three resources below.
#
#  After the first deploy, confirm the two service URLs match the values in
#  the frontend envVars (VITE_API_URL / VITE_SITE_URL). If Render appended a
#  suffix because a name was taken, update those two values and redeploy the
#  static site (Vite inlines them at build time). See README.md.
# ==========================================================================

databases:
  # Managed PostgreSQL. The free instance is deleted ~30 days after creation
  # (fine for a hackathon). Remove this block to run on ephemeral SQLite
  # instead — the backend falls back automatically when DATABASE_URL is unset,
  # and AUTO_SEED repopulates the demo campaign on every boot.
  - name: scamshield-db
    plan: free
    databaseName: scamshield
    user: scamshield

services:
  # ---- Backend: FastAPI + LangGraph multi-agent engine -------------------
  - type: web
    name: scamshield-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
      - key: AUTO_SEED
        value: "true"
      - key: DEMO_MODE
        value: "false"
      # Locked to the frontend origin below. Use "*" if you change the web
      # service name and don't want to touch this again.
      - key: CORS_ORIGINS
        value: "https://scamshield-web.onrender.com"
      # Optional API keys — the app runs fully without them (template
      # explanations + rule-based URL checks). Set real values in the Render
      # dashboard; sync:false keeps them OUT of this committed file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false

  # ---- Frontend: React + Vite static site -------------------------------
  - type: web
    name: scamshield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback: every unknown path serves index.html so client-side
    # routes (/analyze, /report/:id, /network, ...) work on hard refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the built frontend at the backend service above.
      - key: VITE_API_URL
        value: "https://scamshield-api.onrender.com"
      # Public URL of this site (canonical tags, OG, sitemap).
      - key: VITE_SITE_URL
        value: "https://scamshield-web.onrender.com"
